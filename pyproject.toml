[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "miniscope-gui"
version = "0.2.7"
description = "Lightweight miniscope 1-photon calcium imaging and behavior analysis GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "openpyxl>=3.1",
    "certifi",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]

dev = ["pytest>=7"]

[project.scripts]
miniscope-gui = "miniscope_gui.gui.app:main"

[tool.setuptools.packages.find]
include = ["miniscope_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
