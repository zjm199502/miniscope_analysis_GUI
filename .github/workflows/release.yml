name: Build and release

# Manual run: Actions -> "Build and release" -> Run workflow, enter the tag (e.g. v0.2.0).
# The tag must match miniscope_gui/__version__. Without a tag, builds are kept as artifacts only.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.2.0 (empty = build only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install . pytest
      - name: Tests
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pytest -q
      - name: Tag matches version
        if: env.TAG != ''
        run: |
          v=$(python -c "import miniscope_gui; print(miniscope_gui.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG != version v$v"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name MiniscopeAnalysis
          --collect-submodules pyqtgraph --collect-data pyqtgraph
          --exclude-module numba --exclude-module llvmlite --exclude-module matplotlib
          --exclude-module tkinter packaging/launcher.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\MiniscopeAnalysis -DestinationPath MiniscopeAnalysis-Windows.zip
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: MiniscopeAnalysis-Windows.zip, retention-days: 30}

  macos:
    needs: test
    runs-on: macos-latest   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install . pyinstaller
      - name: Build .app
        run: |
          pyinstaller --noconfirm --clean --windowed --name MiniscopeAnalysis \
            --osx-bundle-identifier org.miniscope.analysis \
            --collect-submodules pyqtgraph --collect-data pyqtgraph \
            --exclude-module numba --exclude-module llvmlite --exclude-module matplotlib \
            --exclude-module tkinter packaging/launcher.py
      - name: Zip (for updates) and dmg (for first install)
        run: |
          ditto -c -k --keepParent dist/MiniscopeAnalysis.app MiniscopeAnalysis-macOS-arm64.zip
          mkdir -p dmg && cp -R dist/MiniscopeAnalysis.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname MiniscopeAnalysis -srcfolder dmg -ov -format UDZO MiniscopeAnalysis-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            MiniscopeAnalysis-macOS-arm64.zip
            MiniscopeAnalysis-macOS-arm64.dmg
          retention-days: 30

  release:
    needs: [windows, macos]
    if: (inputs.release_tag || '') != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: assets, merge-multiple: true}
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "MiniscopeAnalysis $TAG" > notes.md
          cat notes.md
      - name: Publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MiniscopeAnalysis $TAG" --notes-file notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" assets/* --clobber
