name: Build and release

# Actions -> "Build and release" -> Run workflow, enter the version (e.g. 0.2.3).
# The version must equal miniscope_gui/__version__ on main.
#
# Every version goes to the in-app update channel (pre-release "updates"):
#   small update  = only the miniscope_gui package (a few hundred KB)
#   full build    = whole app, when x.y.0, when force_full is set,
#                   or when packaging/min_base.txt names this version (libraries changed)
# Version rule: x.y.1 ... x.y.10 are small versions (in-app update only); the
# version after x.y.10 is x.(y+1).0, which is also a normal GitHub Release with
# installers, for new users. A patch number above 10 is refused.
on:
  push:
    tags: ["v[0-9]*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.3"
        required: true
      force_full:
        description: "Also build the whole app (libraries or the launcher changed)"
        type: boolean
        default: false
      attach_to_release:
        description: "Optional: also put the full build on this existing Release (e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      full: ${{ steps.v.outputs.full }}
      major: ${{ steps.v.outputs.major }}
      min_base: ${{ steps.v.outputs.min_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install . pytest
      - name: Tests
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pytest -q
      - id: v
        name: Version and build type
        env: {INPUT_VERSION: "${{ inputs.version || github.ref_name }}", FORCE: "${{ inputs.force_full }}"}
        run: |
          want="${INPUT_VERSION#v}"
          have=$(python -c "import miniscope_gui; print(miniscope_gui.__version__)")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then want="$have"; FORCE=true; fi
          test "$want" = "$have" || { echo "input $want != __version__ $have"; exit 1; }
          patch="${want##*.}"
          min_base=$(tr -d '[:space:]' < packaging/min_base.txt)
          [ "$patch" -le 10 ] || { echo "patch $patch > 10: after x.y.10 comes x.(y+1).0"; exit 1; }
          major=false; [ "$patch" -eq 0 ] && major=true
          full=$major; { [ "$FORCE" = "true" ] || [ "$min_base" = "$want" ]; } && full=true
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "min_base=$min_base" >> "$GITHUB_OUTPUT"
          echo "version $want  full=$full  major=$major  min_base=$min_base"

  windows:
    needs: test
    if: needs.test.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[cuda12]" pyinstaller
      - run: Set-Content -LiteralPath base_version.txt -NoNewline -Encoding ascii -Value "${{ needs.test.outputs.version }}"
        shell: pwsh
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name MiniscopeAnalysis --icon packaging/calcilume.ico
          --add-data "base_version.txt:."
          --hidden-import cupy --additional-hooks-dir packaging/hooks
          --collect-submodules miniscope_gui --collect-data miniscope_gui
          --collect-submodules pyqtgraph --collect-data pyqtgraph
          --exclude-module numba --exclude-module llvmlite --exclude-module matplotlib
          --exclude-module tkinter packaging/launcher.py
      - name: Exercise packaged CUDA compiler and compute backend
        shell: pwsh
        run: ./packaging/test_windows_cuda.ps1
      - name: Build and exercise Windows installer
        shell: pwsh
        run: |
          ./packaging/build_setup.ps1 -Version "${{ needs.test.outputs.version }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/test_setup.ps1 -Version "${{ needs.test.outputs.version }}"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\MiniscopeAnalysis -DestinationPath MiniscopeAnalysis-Windows.zip
      - run: Copy-Item dist/CalciLume-Windows-Setup.exe CalciLume-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 30
          path: |
            MiniscopeAnalysis-Windows.zip
            CalciLume-Windows-Setup.exe

  macos:
    needs: test
    if: needs.test.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Apple-silicon dependencies with macOS 14 MLX wheels
        run: |
          test "$(uname -m)" = arm64
          mlx_req=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["metal"][0])')
          python -m pip download --only-binary=:all: --platform macosx_14_0_arm64 \
            --dest "$RUNNER_TEMP/mlx-wheels" "$mlx_req"
          python -m pip install "$RUNNER_TEMP"/mlx-wheels/*.whl '.[metal]' pyinstaller
      - run: printf %s "${{ needs.test.outputs.version }}" > base_version.txt
      - name: Build .app
        run: |
          pyinstaller --noconfirm --clean --windowed --name MiniscopeAnalysis \
            --icon packaging/calcilume.icns --osx-bundle-identifier org.miniscope.analysis \
            --add-data "base_version.txt:." \
            --hidden-import mlx.core --additional-hooks-dir packaging/hooks \
            --collect-submodules miniscope_gui --collect-data miniscope_gui \
            --collect-submodules pyqtgraph --collect-data pyqtgraph \
            --exclude-module numba --exclude-module llvmlite --exclude-module matplotlib \
            --exclude-module tkinter packaging/launcher.py
      - name: Verify MLX runtime inside the app bundle
        run: |
          runtime=dist/MiniscopeAnalysis.app/Contents/Frameworks/mlx
          test -s "$runtime/lib/mlx.metallib"
          for lib in "$runtime/lib/libmlx.dylib" "$runtime/lib/libjaccl.dylib" "$runtime"/core*.so; do
            test -s "$lib"
            lipo "$lib" -verify_arch arm64
          done
          QT_QPA_PLATFORM=offscreen dist/MiniscopeAnalysis.app/Contents/MacOS/MiniscopeAnalysis --check-macos-runtime
      - name: Sign, (optionally) notarize, zip and dmg
        # ad-hoc signature without secrets; Developer ID + notarization once they are added
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos_sign.sh dist/MiniscopeAnalysis.app MiniscopeAnalysis-macOS-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            MiniscopeAnalysis-macOS-arm64.zip
            MiniscopeAnalysis-macOS-arm64.dmg
          retention-days: 30

  publish:
    permissions:
      contents: write
    concurrency:
      group: calcilume-update-channel
      cancel-in-progress: false
    needs: [test, windows, macos]
    if: always() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.test.outputs.full != 'true' || (needs.windows.result == 'success' && needs.macos.result == 'success'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.test.outputs.version }}
      FULL: ${{ needs.test.outputs.full }}
      MAJOR: ${{ needs.test.outputs.major }}
      MIN_BASE: ${{ needs.test.outputs.min_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.test.outputs.full == 'true'
        with: {path: assets, merge-multiple: true}
      - name: Small update package and notes
        run: |
          zip -qr miniscope_gui-patch.zip miniscope_gui -x '*__pycache__*'
          awk -v t="## v$VERSION" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "MiniscopeAnalysis v$VERSION" > notes.md
          cat notes.md
      - name: Check current update channel
        run: |
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease \
            --title "自动更新通道" --notes "软件内自动更新使用的文件，请不要手动下载。新用户请从最新的正式版本安装。"
          assets=$(gh release view updates --json assets --jq '[.assets[] | select(.name=="latest.json")] | length')
          if [ "$assets" -gt 0 ]; then
            gh release download updates -p latest.json -O old.json
          else
            test "$FULL" = "true"
            echo '{}' > old.json
          fi
          python3 - <<'PY'
          import json, os
          def version(text):
              return tuple(map(int, text.split(".")))
          current = json.load(open("old.json")).get("version", "0.0.0")
          if version(current) > version(os.environ["VERSION"]):
              raise SystemExit(f"Update channel is already at {current}")
          PY
      - name: Publish the verified install files together
        if: needs.test.outputs.major == 'true'
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --json id >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "CalciLume 钙荧 $tag" --notes-file notes.md
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$tag" assets/* miniscope_gui-patch.zip --clobber
            gh release edit "$tag" --draft=false --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > public-release.json
      - name: Update channel
        run: |
          if [ "$MAJOR" != "true" ]; then
            patch="miniscope_gui-patch-$VERSION.zip"
            cp miniscope_gui-patch.zip "$patch"
            upload=("$patch")
            if [ "$FULL" = "true" ]; then upload+=(assets/MiniscopeAnalysis-Windows.zip assets/MiniscopeAnalysis-macOS-arm64.zip assets/CalciLume-Windows-Setup.exe); fi
            gh release upload updates "${upload[@]}" --clobber
          fi
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]; v = os.environ["VERSION"]
          base = f"https://github.com/{repo}/releases/download/updates/"
          old = json.load(open("old.json"))
          major = os.environ["MAJOR"] == "true"
          public = {a["name"]: a for a in json.load(open("public-release.json"))["assets"]} if major else {}
          def asset(name, path):
              if major:
                  a = public[name]
                  assert a["state"] == "uploaded" and a["size"] > 0, name
                  return {"url": a["browser_download_url"], "size": a["size"]}
              return {"url": base + name, "size": os.path.getsize(path)}
          patch = "miniscope_gui-patch.zip" if major else f"miniscope_gui-patch-{v}.zip"
          m = {"version": v, "notes": open("notes.md", encoding="utf-8").read(),
               "min_base": os.environ["MIN_BASE"],
               "page": f"https://github.com/{repo}/releases/latest",
               "patch": asset(patch, "miniscope_gui-patch.zip")}
          if os.environ["FULL"] == "true":
              m["windows_setup"] = asset("CalciLume-Windows-Setup.exe", "assets/CalciLume-Windows-Setup.exe")
              m["full_version"] = v
              m["full"] = {n: asset(n, "assets/" + n)
                           for n in ("MiniscopeAnalysis-Windows.zip", "MiniscopeAnalysis-macOS-arm64.zip")}
          else:
              if old.get("windows_setup"): m["windows_setup"] = old["windows_setup"]
              m["full_version"] = old.get("full_version", "0")
              m["full"] = old.get("full", {})
          json.dump(m, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False, indent=1))
          PY
          gh release upload updates latest.json --clobber
      - name: Also attach the full build to an existing Release
        if: needs.test.outputs.full == 'true' && inputs.attach_to_release != ''
        env: {TARGET: "${{ inputs.attach_to_release }}"}
        run: |
          gh release upload "$TARGET" assets/* --clobber
          gh release view "$TARGET" --json body -q .body > body.md
          printf '\n\n> 安装包已替换为 v%s 的构建（加入软件内小版本更新）。\n' "$VERSION" >> body.md
          gh release edit "$TARGET" --notes-file body.md
